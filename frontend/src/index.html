<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuickDot</title>
  <meta name="description" content="QuickDot — the fastest way to move information between two people or two devices.">
  <meta name="lang" content="en">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <script>
    /* Resolve the theme before first paint so there's no flash. Preference
       (PreferencesService): auto (follow the system), light or dark. */
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('qd-theme') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

      /* Angular relies on APIs that need Chrome 93+, Safari 15.4+ or
         Firefox 95+. Older browsers would crash on bootstrap and show a
         blank page, so flag them: the note in <app-root> shows instead and
         main.ts doesn't start the app (or Sentry). */
      var supported = typeof Object.hasOwn === 'function' &&
        typeof [].at === 'function' &&
        !!(window.crypto && typeof window.crypto.randomUUID === 'function');
      if (!supported) document.documentElement.setAttribute('data-unsupported', '');
    })();
  </script>
  <style>
    .unsupported { display: none; }
    [data-unsupported] .unsupported {
      display: block;
      max-width: 34ch;
      margin: 30vh auto 0;
      padding: 0 22px;
      text-align: center;
      font: 16px/1.5 Inter, system-ui, sans-serif;
      color: var(--ink, #171C1A);
    }
    [data-unsupported] .unsupported h1 { font-size: 22px; margin: 0 0 10px; }
  </style>
  <!-- Link previews (Open Graph / Twitter). URLs must be absolute. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="QuickDot">
  <meta property="og:title" content="QuickDot">
  <meta property="og:description" content="Move text and files between two devices. No accounts. Gone in 30 minutes.">
  <meta property="og:url" content="https://quickdot.amartian.ca/">
  <meta property="og:image" content="https://quickdot.amartian.ca/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="quickdot: two dots joined by a line. Move text and files between two devices.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Angular replaces this on bootstrap; it only stays on old browsers. -->
  <app-root>
    <div class="unsupported">
      <h1>Your browser is out of date</h1>
      <p>QuickDot needs a newer browser. Update your browser (or your phone's software) and try again.</p>
    </div>
  </app-root>
</body>
</html>
