@if (notice.current(); as n) {
  <div class="notice" (click)="onNoticeBackdrop($event)">
    <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="notice-title" aria-describedby="notice-body">
      <h2 id="notice-title">{{ n.title }}</h2>
      <p id="notice-body">{{ n.body }}</p>
      <button #noticeOk type="button" (click)="notice.dismiss()">Got it</button>
    </div>
  </div>
}

<!-- Toasts stack in the bottom-left corner, newest at the bottom. Two
     always-present live regions so they're announced: role="status" for
     confirmations, role="alert" for errors. Errors also get a ⚠ so they
     don't rely on color alone (WCAG 1.4.1). -->
<div class="toaster">
  <div role="status">
    @for (t of toast.toasts(); track t.id) {
      @if (!t.error) {
        <div class="toast">{{ t.message }}</div>
      }
    }
  </div>
  <div role="alert">
    @for (t of toast.toasts(); track t.id) {
      @if (t.error) {
        <div class="toast err"><span aria-hidden="true">⚠ </span>{{ t.message }}</div>
      }
    }
  </div>
</div>
