<header class="topbar">
  <div class="brandmark">quickdot<span class="dot" aria-hidden="true"></span></div>
</header>

<router-outlet />

<footer>
  <div>An <span class="a">Amartian</span> product<span class="fdot" aria-hidden="true"></span>ephemeral by design</div>
  <nav class="legal" aria-label="Legal">
    <a routerLink="/privacy">Privacy</a>

  </nav>

@if (notice.current(); as n) {
  <div class="notice" (click)="onNoticeBackdrop($event)">
    <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="notice-title" aria-describedby="notice-body">
      <h2 id="notice-title">{{ n.title }}</h2>
      <p id="notice-body">{{ n.body }}</p>
      <button #noticeOk type="button" (click)="notice.dismiss()">Got it</button>
    </div>
  </div>
}

<!-- Always-present live regions so toasts are announced: role="status" for
     confirmations, role="alert" for errors. Errors also get a ⚠ so they
     don't rely on color alone (WCAG 1.4.1). The region is fixed, full-width
     and centres the toast with flexbox, so the entry animation (which
     animates transform) can't knock it off-centre. -->
<div class="toaster">
  <div role="status">
    @if (toast.current(); as t) {
      @if (!t.error) {
        <div class="toast on">{{ t.message }}</div>
      }
    }
  </div>
  <div role="alert">
    @if (toast.current(); as t) {
      @if (t.error) {
        <div class="toast on err"><span aria-hidden="true">⚠ </span>{{ t.message }}</div>
      }
    }
  </div>
</div>
