spring.application.name=quickdot

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Origin locked for CORS + WebSocket handshakes (spec §6). Defaults to the
# Angular dev server for local `mvnw spring-boot:run`; every other
# environment (Fly.io) sets APP_ALLOWED_ORIGIN to the real frontend origin.
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:4200}

# Per-IP hash salt for metadata logging (spec §6 — "hashed/truncated IP",
# never the raw address). MUST be overridden via APP_IP_HASH_SALT in any
# environment that logs real traffic — the default here only keeps local
# dev/tests from needing to set it.
app.ip-hash-salt=${APP_IP_HASH_SALT:dev-only-salt-not-for-production}

# Room domain (spec §4, §6)
room.ttl-minutes=30
room.empty-grace-seconds=30
room.max-participants=8
room.max-items=200
room.sweep-interval-ms=10000

# WebSocket keepalive (spec §6)
ws.ping-interval-seconds=20

# Text relay (spec §6)
relay.text.max-messages=30
relay.text.window-seconds=10

# File relay (spec §5, §6)
relay.file.max-size-bytes=26214400
relay.file.chunk-size-bytes=262144
relay.file.blocked-extensions=exe,bat,cmd,com,msi,scr,ps1,sh,bash,vbs,vbe,jar,apk,deb,dmg,pkg,app,gadget,cpl,msc,wsf,hta,reg
relay.upload.max-per-room=10
relay.upload.window-seconds=60

# WebSocket frame buffer sizing — one chunk (256 KB) plus header/JSON overhead
ws.max-binary-message-bytes=270336
ws.max-text-message-bytes=8192
