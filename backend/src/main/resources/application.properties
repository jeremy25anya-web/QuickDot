spring.application.name=quickdot

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Origin locked for CORS + WebSocket handshakes (spec §6). Defaults to the
# Angular dev server for local `mvnw spring-boot:run`; every other
# environment (Fly.io) sets APP_ALLOWED_ORIGIN to the real frontend origin.
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:4200}

# Per-IP hash salt for metadata logging (spec §6 — "hashed/truncated IP",
# never the raw address). MUST be overridden via APP_IP_HASH_SALT in any
# environment that logs real traffic — the default here only keeps local
# dev/tests from needing to set it.
app.ip-hash-salt=${APP_IP_HASH_SALT:dev-only-salt-not-for-production}

# Real client IP (see web.ClientIpResolver): trust Fly's Fly-Client-IP header
# only where Fly's proxy sets it. fly.toml turns this on; off elsewhere so a
# client can't spoof the header to dodge per-IP limits.
app.trust-fly-client-ip=${APP_TRUST_FLY_CLIENT_IP:false}

# Room domain (spec §4, §6)
room.ttl-minutes=30
room.empty-grace-seconds=30
room.max-participants=8
room.max-items=200
room.sweep-interval-ms=10000
room.max-concurrent-per-ip=5
room.max-created-per-hour=20

# WebSocket keepalive (spec §6)
ws.ping-interval-seconds=20

# Text relay (spec §6)
relay.text.max-messages=30
relay.text.window-seconds=10

# File relay (spec §5, §6)
relay.file.max-size-bytes=26214400
relay.file.chunk-size-bytes=262144
relay.file.blocked-extensions=exe,bat,cmd,com,msi,scr,ps1,sh,bash,vbs,vbe,jar,apk,deb,dmg,pkg,app,gadget,cpl,msc,wsf,hta,reg
relay.upload.max-per-room=10
relay.upload.window-seconds=60

# WebSocket frame buffer sizing — one chunk (256 KB) plus header/JSON overhead
ws.max-binary-message-bytes=270336
ws.max-text-message-bytes=8192

# Sentry error monitoring (spec §3, §7) — errors only, no PII.
# Empty DSN (local dev, tests) disables the SDK entirely; Fly sets SENTRY_DSN
# as a secret. No tracing/performance sampling (traces-sample-rate unset).
# SentryScrubber strips requests, users, exception messages and room codes
# from every event before it leaves the process.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.send-default-pii=false
sentry.max-request-body-size=none
sentry.in-app-includes=ca.amartian.quickdot
# ERROR logs become events; WARN+ become breadcrumbs. The audit logger has
# additivity="false" (logback-spring.xml), so it never reaches Sentry.
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=warn
